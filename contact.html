<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Contact — INTELLIFY</title>
  <meta name="description" content="Get in touch with INTELLIFY. WhatsApp, email, or a direct message — we usually respond within hours."/>
  <link rel="icon" type="image/png" href="assets/img/favicon.png"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;600;700;800;900&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
  <script>window.__ALIEN_OPTS__ = { page: 'contact' };</script>
</head>
<body>

<canvas id="particles"></canvas>
<div data-nav></div>

<section style="padding-top: 160px;">
  <div class="container">
    <div class="section-head reveal" style="margin-bottom: 36px;">
      <span class="section-eyebrow">// Open Channel</span>
      <h2>Let's <span class="gradient-text">Connect</span></h2>
      <p>Tell us what you're building. We'll be in orbit within hours.</p>
    </div>

    <div class="contact-grid">
      <div class="info-card reveal" data-contact-info>
        <!-- populated by script -->
      </div>

      <form class="contact-form reveal" id="contact-form" novalidate>
        <div class="form-row">
          <div class="field">
            <label for="cf-name">Full Name</label>
            <input type="text" id="cf-name" name="name" required placeholder="e.g. Captain Nova" autocomplete="name"/>
          </div>
          <div class="field">
            <label for="cf-email">Email Address</label>
            <input type="email" id="cf-email" name="email" required placeholder="you@galaxy.com" autocomplete="email"/>
          </div>
        </div>
        <div class="form-row">
          <div class="field">
            <label for="cf-whatsapp">WhatsApp Number</label>
            <input type="tel" id="cf-whatsapp" name="whatsapp" required placeholder="e.g. +963 9XX XXX XXX" autocomplete="tel" inputmode="tel"/>
          </div>
          <div class="field">
            <label for="cf-subject">Subject</label>
            <input type="text" id="cf-subject" name="subject" placeholder="What's the mission?"/>
          </div>
        </div>
        <div class="field">
          <label for="cf-message">Message</label>
          <textarea id="cf-message" name="message" required placeholder="Tell us about your project, goals, timeline..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;">
          Transmit Message
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
        <div class="form-status" id="form-status"></div>
        <p style="margin-top: 14px; font-size: 0.85rem; color: var(--text-faint);">
          Your message reaches our team instantly and we'll reply on WhatsApp or email — usually within a few hours.
        </p>
      </form>
    </div>
  </div>
</section>

<div data-footer></div>

<!-- Firebase (live database) — harmless until enabled in firebase-config.js -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="assets/js/firebase-config.js"></script>
<script src="assets/js/main.js"></script>
<script>
(function () {
  function renderInfo() {
    const c = AlienStore.get().contact;
    const mount = document.querySelector('[data-contact-info]');
    if (!mount) return;
    mount.innerHTML = `
      <h3>Contact Information</h3>
      <p style="margin-bottom: 8px;">We typically respond within a few hours. Reach us through any of these channels:</p>
      <div class="info-row">
        <div class="info-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </div>
        <div class="info-text">
          <small>WhatsApp (Primary)</small>
          <span><a href="https://wa.me/${c.whatsapp1.replace(/\D/g,'')}" target="_blank" rel="noopener">${escapeHtml(c.whatsapp1)}</a></span>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </div>
        <div class="info-text">
          <small>WhatsApp (Secondary)</small>
          <span><a href="https://wa.me/${c.whatsapp2.replace(/\D/g,'')}" target="_blank" rel="noopener">${escapeHtml(c.whatsapp2)}</a></span>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        </div>
        <div class="info-text">
          <small>Email</small>
          <span><a href="mailto:${c.email}">${escapeHtml(c.email)}</a></span>
        </div>
      </div>
      <div class="info-row">
        <div class="info-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
        </div>
        <div class="info-text">
          <small>Location</small>
          <span>${escapeHtml(c.address || '')}</span>
        </div>
      </div>
    `;
  }
  renderInfo();
  window.addEventListener('alientech:store-change', renderInfo);

  const form = document.getElementById('contact-form');
  const status = document.getElementById('form-status');

  // Best-effort: email a copy of the message to the company inbox via Web3Forms.
  // Never blocks the submission — the live dashboard is the source of truth.
  async function emailCopy(d) {
    const key = window.WEB3FORMS_ACCESS_KEY;
    if (!key || key === 'PASTE_YOUR_WEB3FORMS_ACCESS_KEY') return; // email not set up yet
    const res = await fetch('https://api.web3forms.com/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      body: JSON.stringify({
        access_key: key,
        subject: `INTELLIFY website — ${d.subject}`,
        from_name: 'INTELLIFY Website',
        name: d.name,
        email: d.email,
        message:
          `New message from the INTELLIFY contact form\n\n` +
          `Name: ${d.name}\n` +
          `Email: ${d.email}\n` +
          `WhatsApp: ${d.whatsapp}\n` +
          `Subject: ${d.subject}\n\n` +
          `${d.message}`
      })
    });
    if (!res.ok) throw new Error('Email service returned ' + res.status);
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = form.elements['name'].value.trim();
    const email = form.email.value.trim();
    const whatsapp = form.querySelector('[name="whatsapp"]').value.trim();
    const subject = form.subject.value.trim() || 'New message from INTELLIFY website';
    const message = form.message.value.trim();

    if (!name || !email || !whatsapp || !message) {
      status.className = 'form-status show error';
      status.textContent = 'Please fill in your name, email, WhatsApp number and message.';
      return;
    }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) {
      status.className = 'form-status show error';
      status.textContent = 'Please enter a valid email address.';
      return;
    }
    if (whatsapp.replace(/\D/g, '').length < 7) {
      status.className = 'form-status show error';
      status.textContent = 'Please enter a valid WhatsApp number.';
      return;
    }

    const btn = form.querySelector('button[type="submit"]');
    if (btn) btn.disabled = true;
    status.className = 'form-status show';
    status.textContent = 'Transmitting…';

    const payload = { name, email, whatsapp, subject, message };
    try {
      // 1) Save to the live dashboard — real-time, visible from any device.
      await AlienMessages.submit(payload);

      // 2) Email a copy to the company inbox (best-effort, never blocks).
      emailCopy(payload).catch(err => console.warn('Email copy failed', err));

      status.className = 'form-status show success';
      status.textContent = 'Message sent! Our team has it and will be in touch shortly.';
      AlienToast('Message transmitted successfully', 'success');
      form.reset();
    } catch (err) {
      console.error('Message submit failed', err);
      status.className = 'form-status show error';
      status.textContent = 'Could not send your message. Please try again, or reach us on WhatsApp.';
      AlienToast('Sending failed — please try again', 'error');
    } finally {
      if (btn) btn.disabled = false;
    }
  });
})();
</script>
</body>
</html>
