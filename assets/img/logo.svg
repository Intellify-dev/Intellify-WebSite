<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="ag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <radialGradient id="ag2" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0a0e27" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="32" cy="32" r="30" fill="url(#ag2)"/>
  <g filter="url(#glow)" stroke="url(#ag)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Alien head -->
    <path d="M32 10 C44 10 50 20 50 30 C50 42 42 52 32 54 C22 52 14 42 14 30 C14 20 20 10 32 10 Z"/>
    <!-- Eyes -->
    <ellipse cx="24" cy="30" rx="4" ry="6" fill="url(#ag)" stroke="none"/>
    <ellipse cx="40" cy="30" rx="4" ry="6" fill="url(#ag)" stroke="none"/>
    <!-- Antennae -->
    <path d="M22 12 L18 4"/>
    <circle cx="18" cy="4" r="1.5" fill="url(#ag)" stroke="none"/>
    <path d="M42 12 L46 4"/>
    <circle cx="46" cy="4" r="1.5" fill="url(#ag)" stroke="none"/>
    <!-- Circuit lines -->
    <path d="M14 38 L8 38 M14 42 L4 42"/>
    <path d="M50 38 L56 38 M50 42 L60 42"/>
    <path d="M32 54 L32 60"/>
    <circle cx="32" cy="60" r="1.5" fill="url(#ag)" stroke="none"/>
  </g>
</svg>
